# ==================== اطلاعات پایه ====================
num_labels: 4  # ✅ باید در root باشد نه در زیرشاخه

# ==================== داده‌ها ====================
data:
  max_seq_length: 128
  train_val_test_split: [0.7, 0.15, 0.15]
  undersample_ratio: 0.3

# ==================== پیش‌پردازش ====================
preprocessing:
  url_decode: true
  remove_comments: true
  normalize_whitespace: true
  lowercase: false

# ==================== جاسازی‌ها ====================
embedding:
  embedding_dim: 300
  embedding_dropout: 0.2
  attention_dropout: 0.2

# ==================== Sec-BERT ====================
sec_bert:
  model_name: "jackaduma/SecBERT"
  freeze_layers: 8
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 500
  batch_size: 16
  epochs: 5
  max_grad_norm: 1.0

# ==================== CNN-BiLSTM ====================
cnn_bilstm:
  lstm:
    units: 256
    dropout: 0.3
  dropout: 0.3

# ==================== طبقه‌بندی ====================
focal_loss:
  alpha: [0.25, 0.25, 0.25, 0.25]  # برای هر کلاس
  gamma: 2.0
classifier_dropout: 0.3

# ==================== آنومالی‌دیتکشن ====================
anomaly_detection:
  autoencoder:
    latent_dim: 32
    learning_rate: 0.001
    epochs: 50
  isolation_forest:
    n_estimators: 200
    contamination: 0.01
  anomaly_threshold: 0.5

# ==================== Ensemble ====================
fusion:
  weights: [0.6, 0.4]  # [classifier, anomaly]
  threshold: 0.5